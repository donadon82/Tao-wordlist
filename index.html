<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Password Wordlist Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --success-color: #4ade80;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 { color: var(--accent-color); margin-bottom: 5px; font-size: 1.8rem; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 { margin-top: 0; border-bottom: 2px solid #334155; padding-bottom: 8px; font-size: 1.1rem; color: #94a3b8; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: 0.95rem; }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 1rem;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 14px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; background-color: var(--success-color); }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            background-color: #0f172a;
            border-left: 4px solid var(--accent-color);
            display: none;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .ads-placeholder {
            background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #334155 10px, #334155 20px);
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔐 Advanced Wordlist Generator</h1>
        <p>Bộ tổ hợp từ điển tối ưu hóa khử trùng chéo chuyên nghiệp</p>
    </header>

    <div class="ads-placeholder">[Vị trí đặt mã quảng cáo Google AdSense - Banner 728x90]</div>

    <div class="card">
        <h2>🛠️ Công cụ: Tạo từ điển bẻ khóa/kiểm thử (Phân tách bằng khoảng trắng)</h2>
        
        <!-- Ô NHẬP 1: CHỮ -->
        <label for="input-chu">📝 Nhập các CHỮ gốc (Cách nhau bằng DẤU CÁCH):</label>
        <input type="text" id="input-chu" placeholder="Ví dụ: Hang thuhang phong">
        
        <!-- Ô NHẬP 2: SỐ -->
        <label for="input-so">🔢 Nhập các SỐ (Cách nhau bằng DẤU CÁCH):</label>
        <input type="text" id="input-so" placeholder="Ví dụ: 123 222 345">
        
        <!-- Ô NHẬP 3: KÝ TỰ -->
        <label for="input-kytu">🔣 Nhập các KÝ TỰ đặc biệt (Cách nhau bằng DẤU CÁCH):</label>
        <input type="text" id="input-kytu" placeholder="Ví dụ: @ $ ! %">

        <button onclick="generateAdvancedWordlist()">⚡ Bắt đầu tổ hợp & Tải file wordlist.txt</button>
        
        <div id="status-box" class="status"></div>
    </div>

    <div class="ads-placeholder">[Vị trí đặt mã quảng cáo Google AdSense]</div>
</div>

<script>
    function toTitleCase(str) {
        return str.toLowerCase().replace(/(?:^|\s)\S/g, function(a) { return a.toUpperCase(); });
    }

    function toSentenceCase(str) {
        if (!str) return "";
        return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    // HÀM CHUYÊN BIỆT: Chỉ phân tách bằng khoảng trắng, tự động xóa bỏ dấu phẩy nếu có
    function processInputSpace(elementId) {
        let val = document.getElementById(elementId).value;
        // Thay thế tất cả dấu phẩy thành khoảng trắng, sau đó cắt theo khoảng trắng
        val = val.replace(/,/g, ' ');
        return val.split(/\s+/).map(item => item.trim()).filter(item => item.length > 0);
    }

    function generateAdvancedWordlist() {
        const statusBox = document.getElementById('status-box');
        statusBox.style.display = "block";
        statusBox.innerHTML = "⏳ Đang tính toán dữ liệu hoán vị cạn kiệt...";
        statusBox.style.borderLeftColor = "#38bdf8";

        const chuGoc = processInputSpace('input-chu');
        const so = processInputSpace('input-so');
        const kytu = processInputSpace('input-kytu');

        if (chuGoc.length === 0 && so.length === 0 && kytu.length === 0) {
            statusBox.innerHTML = "⚠️ Lỗi: Vui lòng nhập dữ liệu vào ít nhất một ô!";
            statusBox.style.borderLeftColor = "#f87171";
            return;
        }

        // 1. Chuẩn hóa các biến thể chữ (Thường, Hoa, Pascal, Sentence)
        const chuSach = new Set();
        chuGoc.forEach(word => {
            chuSach.add(word);
            chuSach.add(word.toLowerCase());
            chuSach.add(word.toUpperCase());
            chuSach.add(toTitleCase(word));
            chuSach.add(toSentenceCase(word));
        });
        const currentChu = Array.from(chuSach);

        // 2. Chạy full thuật toán logic tổ hợp
        const finalWordlistSet = new Set();

        if(currentChu.length > 0 && so.length > 0 && kytu.length > 0) {
            // Trọn bộ 6 hoán vị cốt lõi của Chữ + Số + Ký tự
            for (let c of currentChu) {
                for (let s_val of so) {
                    for (let k of kytu) {
                        finalWordlistSet.add(`${c}${s_val}${k}`);
                        finalWordlistSet.add(`${c}${k}${s_val}`);
                        finalWordlistSet.add(`${s_val}${c}${k}`);
                        finalWordlistSet.add(`${s_val}${k}${c}`);
                        finalWordlistSet.add(`${k}${c}${s_val}`);
                        finalWordlistSet.add(`${k}${s_val}${c}`);
                    }
                }
            }
        }

        // Thuần chữ, chữ + số, số + chữ, chữ + ký tự
        if(currentChu.length > 0) {
            for (let c of currentChu) {
                finalWordlistSet.add(c);
                for (let s_val of so) {
                    finalWordlistSet.add(`${c}${s_val}`);
                    finalWordlistSet.add(`${s_val}${c}`);
                }
                for (let k of kytu) {
                    finalWordlistSet.add(`${c}${k}`);
                    finalWordlistSet.add(`${k}${c}`);
                }
            }
            // Nhân bản chữ
            for (let c1 of currentChu) {
                for (let c2 of currentChu) {
                    finalWordlistSet.add(`${c1}${c2}`);
                    for (let k of kytu) finalWordlistSet.add(`${c1}${c2}${k}`);
                    for (let s_val of so) finalWordlistSet.add(`${c1}${s_val}${c2}`);
                }
            }
        }

        // Tổ hợp nâng cao dính líu đến ký tự
        if(kytu.length > 0 && currentChu.length > 0) {
            for (let k of kytu) {
                for (let c1 of currentChu) {
                    for (let c2 of currentChu) {
                        for (let s_val of so) finalWordlistSet.add(`${k}${c1}${c2}${s_val}`);
                    }
                }
            }
            for (let k1 of kytu) {
                for (let c of currentChu) {
                    for (let k2 of kytu) {
                        finalWordlistSet.add(`${k1}${c}${k2}`);
                        for (let s_val of so) {
                            finalWordlistSet.add(`${k1}${c}${s_val}${k2}`);
                            finalWordlistSet.add(`${k1}${c}${k2}${s_val}`);
                        }
                    }
                }
            }
            for (let k of kytu) {
                for (let c of currentChu) {
                    for (let s_val of so) finalWordlistSet.add(`${k}${k}${c}${s_val}`);
                }
            }
        }

        // Tổ hợp riêng của Số và Ký tự
        if(so.length > 0) {
            for (let s_val of so) {
                finalWordlistSet.add(s_val);
                for (let k of kytu) {
                    finalWordlistSet.add(`${k}${s_val}`);
                    finalWordlistSet.add(`${s_val}${k}`);
                }
            }
            for (let s1 of so) {
                for (let k of kytu) {
                    for (let s2 of so) finalWordlistSet.add(`${s1}${k}${s2}`);
                }
            }
        }

        const finalArray = Array.from(finalWordlistSet);

        if (finalArray.length === 0) {
            statusBox.innerHTML = "❌ Không có từ khóa nào được tạo ra.";
            statusBox.style.borderLeftColor = "#f87171";
            return;
        }

        // 3. Xuất dữ liệu, mỗi từ khóa nằm trên một dòng riêng biệt sạch sẽ
        const blob = new Blob([finalArray.join('\n')], { type: 'text/plain;charset=utf-8' });
        const anchor = document.createElement('a');
        anchor.download = 'wordlist.txt';
        anchor.href = window.URL.createObjectURL(blob);
        anchor.click();
