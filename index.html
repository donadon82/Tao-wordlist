<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Password Wordlist Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --success-color: #4ade80;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 { color: var(--accent-color); margin-bottom: 5px; font-size: 1.8rem; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 { margin-top: 0; border-bottom: 2px solid #334155; padding-bottom: 8px; font-size: 1.1rem; color: #94a3b8; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: 0.95rem; }
        
        /* Định dạng ô nhập liệu bằng dấu phẩy cho gọn và dễ dùng */
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 1rem;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 14px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; background-color: var(--success-color); }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            background-color: #0f172a;
            border-left: 4px solid var(--accent-color);
            display: none;
            font-size: 0.9rem;
        }
        .ads-placeholder {
            background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #334155 10px, #334155 20px);
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔐 Advanced Wordlist Generator</h1>
        <p>Bộ tổ hợp từ điển tối ưu hóa khử trùng chéo chuyên nghiệp</p>
    </header>

    <!-- BANNER QUẢNG CÁO KIẾM TIỀN -->
    <div class="ads-placeholder">[Vị trí đặt mã quảng cáo Google AdSense - Banner 728x90]</div>

    <div class="card">
        <h2>🛠️ Công cụ: Tạo từ điển bẻ khóa/kiểm thử (Lọc trùng chéo nâng cao)</h2>
        
        <!-- Ô NHẬP 1: CHỮ -->
        <label for="input-chu">📝 Nhập các CHỮ gốc (Cách nhau bằng dấu phẩy):</label>
        <input type="text" id="input-chu" placeholder="Ví dụ: thuy, phong, admin">
        
        <!-- Ô NHẬP 2: SỐ -->
        <label for="input-so">🔢 Nhập các SỐ (Cách nhau bằng dấu phẩy):</label>
        <input type="text" id="input-so" placeholder="Ví dụ: 1984, 123, 2026">
        
        <!-- Ô NHẬP 3: KÝ TỰ -->
        <label for="input-kytu">🔣 Nhập các KÝ TỰ đặc biệt (Cách nhau bằng dấu phẩy):</label>
        <input type="text" id="input-kytu" placeholder="Ví dụ: @, $, @$&">

        <button onclick="generateAdvancedWordlist()">⚡ Bắt đầu tổ hợp & Tải file wordlist.txt</button>
        
        <div id="status-box" class="status"></div>
    </div>

    <div class="ads-placeholder">[Vị trí đặt mã quảng cáo Google AdSense]</div>
</div>

<script>
    // Hàm chuẩn hóa viết hoa chữ cái đầu của mỗi từ (PascalCase)
    function toTitleCase(str) {
        return str.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join('').replace(/\s+/g, '');
    }

    // Hàm chuẩn hóa viết hoa chữ cái đầu tiên của toàn chuỗi (SentenceCase)
    function toSentenceCase(str) {
        const cleanStr = str.replace(/\s+/g, '');
        if (!cleanStr) return "";
        return cleanStr.charAt(0).toUpperCase() + cleanStr.slice(1).toLowerCase();
    }

    // Hàm xử lý dữ liệu đầu vào phân tách bằng dấu phẩy
    function processInput(elementId) {
        return document.getElementById(elementId).value
            .split(',')
            .map(item => item.trim())
            .filter(item => item.length > 0);
    }

    function generateAdvancedWordlist() {
        const statusBox = document.getElementById('status-box');
        statusBox.style.display = "block";
        statusBox.innerHTML = "⏳ Đang tính toán dữ liệu và khử trùng lặp chéo...";
        statusBox.style.borderLeftColor = "#38bdf8";

        const chuGoc = processInput('input-chu');
        const so = processInput('input-so');
        const kytu = processInput('input-kytu');

        if (chuGoc.length === 0 || so.length === 0 || kytu.length === 0) {
            statusBox.innerHTML = "⚠️ Lỗi: Vui lòng nhập đầy đủ dữ liệu vào cả 3 ô (Chữ, Số, Ký tự)!";
            statusBox.style.borderLeftColor = "#f87171";
            return;
        }

        // 1. Tạo các biến thể chữ sạch không trùng nhau (Thường, Hoa, Title, Sentence)
        const chuSach = new Set();
        chuGoc.forEach(line => {
            const cleanLine = line.replace(/\s+/g, '');
            chuSach.add(cleanLine);
            chuSach.add(cleanLine.toLowerCase());
            chuSach.add(cleanLine.toUpperCase());
            chuSach.add(toTitleCase(line));
            chuSach.add(toSentenceCase(line));
        });
        const currentChu = Array.from(chuSach);

        // 2. Chạy thuật toán tổ hợp theo cấu trúc của bạn
        const finalWordlistSet = new Set();

        // TỔ HỢP 1: Chữ + Số 1 + Ký tự + Số 2 ($c$s1$k$s2)
        for (let c of currentChu) {
            for (let s1 of so) {
                for (let k of kytu) {
                    for (let s2 of so) {
                        finalWordlistSet.add(`${c}${s1}${k}${s2}`);
                    }
                }
            }
        }

        // TỔ HỢP 3: Số + Ký tự 1 + Chữ + Ký tự 2 ($s_val$k1$c$k2)
        for (let s_val of so) {
            for (let k1 of kytu) {
                for (let c of currentChu) {
                    for (let k2 of kytu) {
                        finalWordlistSet.add(`${s_val}${k1}${c}${k2}`);
                    }
                }
            }
        }

        const finalArray = Array.from(finalWordlistSet);

        if (finalArray.length === 0) {
            statusBox.innerHTML = "❌ Không có từ khóa nào được tạo ra.";
            return;
        }

        // 3. Xuất file .txt tải về máy
        const blob = new Blob([finalArray.join('\n')], { type: 'text/plain;charset=utf-8' });
        const anchor = document.createElement('a');
        anchor.download = 'wordlist.txt';
        anchor.href = window.URL.createObjectURL(blob);
        anchor.click();

        statusBox.innerHTML = `✅ <b>Hoàn thành!</b> Đã tạo ra <b>${finalArray.toLocaleString()}</b> từ khóa độc nhất không trùng lặp. File <b>wordlist.txt</b> đang được tải về máy của bạn.`;
        statusBox.style.borderLeftColor = "#4ade80";
    }
</script>
</body>
</html>
