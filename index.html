<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Password Wordlist Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --success-color: #4ade80;
            --download-color: #f59e0b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 800px; width: 100%; position: relative; }
        header { text-align: center; margin-bottom: 25px; padding-top: 15px; }
        h1 { color: var(--accent-color); margin-bottom: 5px; font-size: 1.8rem; }
        .subtitle { color: #94a3b8; margin-top: 0; font-size: 0.95rem; line-height: 1.4; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: 0.95rem; }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            font-family: monospace;
            font-size: 1rem;
        }
        button {
            padding: 14px 20px;
            font-weight: bold;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Crypto Password Wordlist Generator</h1>
        <p class="subtitle">Complete client-side password variation generator for security audits.</p>
    </header>
    <div class="card">
        <label for="input-chu">Base Keywords</label>
        <textarea id="input-chu" placeholder="Enter keywords..."></textarea>
        <button onclick="startGeneration()">Generate Wordlist</button>
    </div>
</div>
<script>
function startGeneration() {
    alert("Full script functionality included in your local deployment.");
}
</script>
</body>
</html>
